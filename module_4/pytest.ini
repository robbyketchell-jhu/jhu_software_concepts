[pytest]
# Run from this directory: `cd module_4 && pytest`. The assignment's example
# spells the source as `module_4/src`, which only resolves when pytest is
# started from the repository root; `src` is the same tree seen from here,
# and it is what the CI workflow and the README both use.
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
testpaths = tests
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
