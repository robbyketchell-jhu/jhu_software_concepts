name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite always appends _test to the database name, so this resolves
      # to gradcafe_test and never touches anything else.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_4/requirements.txt

      - name: Run the test suite with coverage
        working-directory: module_4
        run: pytest -m "web or buttons or analysis or db or integration"

      - name: Write the coverage summary
        if: always()
        working-directory: module_4
        run: |
          coverage report --show-missing | tee coverage_summary.txt

      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: module_4/coverage_summary.txt

  docs:
    name: sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_4/requirements.txt

      - name: Build the documentation
        working-directory: module_4/docs
        run: sphinx-build -b html . _build/html -W --keep-going
